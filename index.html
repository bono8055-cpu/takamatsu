<script type="module">
/* ═══════════════════════════════════════════════════
   ① 여기에 Firebase 설정을 붙여넣으세요.
   비워두면 "혼자 보기 모드"로 돌아갑니다 (체크·댓글이 이 기기에만 남음).
   ═══════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC5FPhNXz-cWO6bYHblo1zgadknCaJjwIw",
  authDomain: "takamatsu-2fdbb.firebaseapp.com",
  projectId: "takamatsu-2fdbb",
  storageBucket: "takamatsu-2fdbb.firebasestorage.app",
  messagingSenderId: "985581763677",
  appId: "1:985581763677:web:f8215b97ac61f92c3661b4"
};

/* ② 가족 이름 — 자유롭게 고치세요 */
const MEMBERS = ['아버지','큰 딸','큰 사위','장남','며느리','막내 딸','막내 사위'];

/* ───────── 저장소 계층 ───────── */
const LS = { get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let db=null, F=null, online=false;
const local = { checks:{}, comments:[], reactions:{}, times:{} };
const listeners = { checks:[], comments:[], reactions:[], times:[] };
const notify = k => listeners[k].forEach(f=>f());

async function initDB(){
  if(!FIREBASE_CONFIG.projectId) return false;
  try{
    const a = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const au = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    F = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const app = a.initializeApp(FIREBASE_CONFIG);
    // 익명 로그인 — 사용자는 아무것도 하지 않아요. 외부 접근을 막기 위한 열쇠 역할.
    await au.signInAnonymously(au.getAuth(app));
    db = F.getFirestore(app);
    F.onSnapshot(F.collection(db,'checks'), s=>{
      local.checks={}; s.forEach(d=>local.checks[d.id]=d.data()); notify('checks');
    });
    F.onSnapshot(F.query(F.collection(db,'comments'),F.orderBy('at','asc')), s=>{
      local.comments=[]; s.forEach(d=>local.comments.push({id:d.id,...d.data()})); notify('comments');
    });
    F.onSnapshot(F.collection(db,'reactions'), s=>{
      local.reactions={}; s.forEach(d=>local.reactions[d.id]=d.data()); notify('reactions');
    });
    F.onSnapshot(F.collection(db,'times'), s=>{
      local.times={}; s.forEach(d=>local.times[d.id]=d.data()); notify('times');
    });
    return true;
  }catch(e){ console.warn('Firebase 연결 실패',e); return false; }
}
const now = ()=>Date.now();
async function setCheck(id,on,by){
  if(on) local.checks[id]={by,at:now()}; else delete local.checks[id];
  notify('checks');
  if(!online) return;
  try{ on ? await F.setDoc(F.doc(db,'checks',id),{by,at:now()})
          : await F.deleteDoc(F.doc(db,'checks',id)); }catch(e){console.warn(e)}
}
async function addComment(stop,text,by){
  const o={stop,text,by,at:now()};
  if(!online){ local.comments.push({id:'l'+Math.random(),...o}); notify('comments'); return; }
  try{ await F.addDoc(F.collection(db,'comments'),o); }catch(e){console.warn(e)}
}
async function delComment(id){
  if(!online){ local.comments=local.comments.filter(c=>c.id!==id); notify('comments'); return; }
  try{ await F.deleteDoc(F.doc(db,'comments',id)); }catch(e){console.warn(e)}
}
async function toggleReact(stop,by){
  const id=`${stop}__${by}`;
  const had=!!local.reactions[id];
  if(had) delete local.reactions[id]; else local.reactions[id]={stop,by,at:now()};

async function setTime(id,d,by){

}

/* 구글 지도 — 한국어 지명으로 띄운다. 키는 bono8055-cpu.github.io 에서만 쓰이도록 제한돼 있다 */
const GMAPS_KEY='AIzaSyACqk-wX4FLjgAZzIlF3U35PgDlbn3PaOY';
let gmReady=null;
function loadGmaps(){
  if(gmReady) return gmReady;
  gmReady=new Promise((ok,no)=>{
    window.__gmInit=async()=>{ try{
      const [maps,core]=await Promise.all([google.maps.importLibrary('maps'),google.maps.importLibrary('core')]);
      /* 번호 핀과 이름을 한 덩어리 HTML로 얹는다 */
      class Pin extends maps.OverlayView{
        constructor(pos,html,onTap){ super(); this.pos=pos; this.el=document.createElement('div'); this.el.className='gpin'; this.el.innerHTML=html; this.el.addEventListener('click',onTap); }
        onAdd(){ this.getPanes().overlayMouseTarget.appendChild(this.el); }
        draw(){ const p=this.getProjection().fromLatLngToDivPixel(this.pos); this.el.style.left=p.x+'px'; this.el.style.top=p.y+'px'; }
        onRemove(){ this.el.remove(); }
      }
      ok({...maps,...core,Pin});
    }catch(e){ no(e); } };
    const sc=document.createElement('script');
    sc.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&language=ko&region=JP&loading=async&callback=__gmInit`;
    sc.async=true; sc.onerror=()=>no(new Error('load')); document.head.appendChild(sc);
  });
  return gmReady;
}

function drawMaps(i){
  const d=DAYS[i]; if(!d.maps) return;
  d.maps.forEach((m,k)=>{
    const id=i+'_'+k, box=document.getElementById('lmap'+id); if(!box||MAPS[id]) return;
    MAPS[id]=1;
    loadGmaps().then(gm=>{ MAPS[id]=makeMap(gm,d,m,box); })
      .catch(()=>{ delete MAPS[id]; box.textContent='지도를 불러오지 못했어요. 네트워크를 확인해 주세요.'; });
  });
}

function makeMap(gm,d,m,box){
  /* 처음 크기에서는 한 손가락이 페이지 스크롤이고 두 손가락으로 확대 · 이동한다 */
  const map=new gm.Map(box,{disableDefaultUI:true,clickableIcons:false,keyboardShortcuts:false,
    gestureHandling:'cooperative',mapTypeId:'roadmap',
    styles:[{featureType:'poi.business',stylers:[{visibility:'off'}]}]});
  /* 흰 테두리를 한 겹 깔아 선이 지도에 묻히지 않게 한다. 선 굵기는 화면 픽셀이라 확대해도 그대로다 */
  m.path.forEach(([,co,mode],q)=>{
    const path=co.map(([la,ln])=>({lat:la,lng:ln})), col=LEGC[q%LEGC.length];
    new gm.Polyline({map,path,clickable:false,zIndex:1,strokeColor:'#fff',strokeOpacity:.95,strokeWeight:8});
    new gm.Polyline({map,path,clickable:false,zIndex:2,...(mode
      ? {strokeOpacity:0,icons:[{icon:{path:google.maps.SymbolPath.CIRCLE,scale:2,fillColor:col,fillOpacity:1,strokeOpacity:0},offset:'0',repeat:'9px'}]}
      : {strokeColor:col,strokeOpacity:1,strokeWeight:4})});
  });
  const at=new Map();
  m.idx.forEach(j=>{ const x=d.route[j], key=x.p.ll.join();
    if(!at.has(key)) at.set(key,{ll:x.p.ll,n:x.n,nums:[],rows:[]});
    at.get(key).nums.push(j+1); at.get(key).rows.push(`${j+1}. ${x.t} ${x.r}`); });
  const iw=new gm.InfoWindow();
  const bounds=new gm.LatLngBounds();
  for(const g of at.values()){
    const pos=new gm.LatLng(g.ll[0],g.ll[1]); bounds.extend(pos);
    new gm.Pin(pos,`<div class="pin">${g.nums.join('·')}</div><div class="plabel">${esc(g.n)}</div>`,
      ()=>{ iw.setContent(`<b>${esc(g.n)}</b><br>${g.rows.join('<br>')}`); iw.setPosition(pos); iw.open({map}); }).setMap(map);
  }
  map.fitBounds(bounds,36);
  /* 처음 크기보다 작게는 줄지 않는다. 확대했을 때만 한 손가락으로 지도를 옮기고, 처음 크기로 돌아오면 제자리로 되돌린다 */
  google.maps.event.addListenerOnce(map,'idle',()=>{
    const z0=map.getZoom(), home=map.getCenter();
    map.setOptions({minZoom:z0});
    map.addListener('zoom_changed',()=>{
      if(map.getZoom()>z0) map.setOptions({gestureHandling:'greedy'});
      else { map.setOptions({gestureHandling:'cooperative'}); map.setCenter(home); }
    });
  });
  return map;
}

  {t:'10:30',h:'다카마쓰공항 · 도착',p:'입국심사와 짐 찾기에 30~50분이 걸려요. 렌터카 회사 셔틀을 타고 공항 북쪽 영업소로 가요(1.8km · 4분). 7명과 캐리어 6개가 한 차로 움직여요.',map:P.airport},
  {t:'11:15',h:'렌터카 인수 · 영업소',p:'8인승 밴. 수속 20분이라 11:35쯤 출발해요. 국제면허증과 교대 운전자 등록을 확인해요. 연료는 가득 채워 받고 가득 채워 돌려줘요. 7명이 다 타면 트렁크에는 큰 캐리어가 2개쯤 들어가요. 나머지는 세워서 2열 · 3열 발밑에 둬요.',
   slack:'발밑이 모자라면 3열 한쪽을 접어 그 칸에 실어요. 한쪽만 접혀도 7명이 앉는지는 차마다 달라 직원에게 「三列目、片側だけ畳めますか？」(산레츠메, 카타가와다케 타타메마스카? · 3열 한쪽만 접을 수 있어요?)라고 물어봐요.',tags:['국제면허증 · 여권','연료 가득 반납'],map:P.rental},

  {k:1,t:'11:55',h:'우동① 나카니시우동',p:'아침 7시부터 여는 노포 셀프집. 매장이 넓어 7명이 붙어 앉기 쉬워요. 11:55면 점심 줄이 서기 전이에요. 45분.',

 note:'<b>토요일은 차를 싣고 쇼도시마로 가요.</b> 가는 배 08:02, 오는 배 16:30을 둘 다 예약해 두었어요. <b>출항 30분 전까지 항구에 도착</b>해야 해서 07:15에 출발해요. 엔젤로드는 11:26까지 건널 수 있어 09:10 도착이면 넉넉해요. 섬이 커서 하루 종일 차로 다니고, 미술관 대신 풍경과 먹거리로 채워요.',

   resv:{ok:1,how:'<b>갈 때 08:02, 올 때 16:30 배를 예약해 두었어요.</b> 매표소에서 예약 확인 메일(또는 예약 완료 화면 캡처)과 <b>차검증(車検証 · 샤켄쇼-)</b>을 보여주고 현금으로 표를 사요. 차검증은 렌터카 조수석 서랍에 있어요. 렌터카라 번호판을 이때 알려줘요. 차 6,330엔에 사람 700엔씩 여섯이라 편도 10,530엔, 왕복 21,060엔이에요. 취소는 7일 전부터 30%, 3일 전부터 50%, 당일 100%예요. 왕복이면 할인될 수 있어 창구에서 「往復割引ありますか？」(오-후쿠 와리비키 아리마스카?)라고 물어봐요. 창구에서는 「予約しているリムです。車検証です。」(요야쿠시테 이루 리무데스. 샤켄쇼-데스 · 예약한 임이에요. 차검증이에요)라고 말하며 메일과 차검증을 내밀어요.',

function stopBlock(o,id,mode){
  const links=[];
  if(o.map)links.push(`<a class="go" href="${M(o.map)}" target="_blank" rel="noopener">지도</a>`);
  /* 배로 건너는 칸 · 앞에 이동 칸이 없는 칸은 길찾기를 달지 않는다. dir 이 있으면 그곳으로, 차로 가는 곳에 주차장이 있으면 주차장으로 안내한다 */
  if(o.map&&mode&&!o.h.startsWith('⛴')){ const to=o.dir||(mode==='driving'&&o.park?o.park:o.map);
    links.push(`<a class="go d" href="${DIR(to,mode)}" target="_blank" rel="noopener">${DIRLABEL[mode]}</a>`); }
  if(o.park)links.push(`<a class="go p" href="${M(o.park)}" target="_blank" rel="noopener">🅿 ${o.park.n}</a>`);
  return `<div class="stop${o.k?' key':''}${o.m?' move':''}" data-id="${id}">
    <div class="t" data-tm="${id}" title="누르면 실제 시각으로 고칠 수 있어요. 뒤 일정도 같이 밀려요">${o.t}</div><h3>${o.h}</h3>${o.p?`<p>${o.p}</p>`:''}
    ${o.tags?`<div class="tags">${o.tags.map(t=>`<span class="tag${t.startsWith('⚠')||t.includes('예약 필수')||t.includes('현금')?' w':''}">${t}</span>`).join('')}</div>`:''}
    ${links.length?`<div class="links">${links.join('')}</div>`:''}
    ${o.slack?`<div class="slack"><b>늦어지면</b> ${o.slack}</div>`:''}
    ${detail(o)}
    ${o.m?'':`<div class="bar" data-bar="${id}"></div><div class="thread" data-th="${id}"></div>`}
  </div>`;
}

function showTab(key){

/* 폰의 뒤로 버튼 — 탭을 옮길 때마다 기록을 하나 쌓는다.
   탭 안에서 아래로 내려가 있으면 기록을 하나 더 쌓아서, 뒤로를 누르면 먼저 맨 위로 올라가고 한 번 더 누르면 이전 탭으로 간다 */
let curTab=(nav.querySelector('button.on')||nav.children[0]).dataset.i;
/* nav 는 고정 막대 안쪽 요소라 offsetTop 이 늘 0 이다. 기준은 일정 본문이 시작하는 높이로 잡는다 */
const DEEP=()=>window.scrollY>panes.offsetTop+300, NEARTOP=()=>window.scrollY<panes.offsetTop;
if('scrollRestoration' in history) history.scrollRestoration='manual';   // 뒤로 갈 때 브라우저가 예전 스크롤 위치로 되돌리지 않게 한다
history.replaceState({t:curTab,s:0},'');
nav.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const key=b.dataset.i;
  if(key!==curTab){ curTab=key; history.pushState({t:key,s:0},''); }
  showTab(key);
});
let backing=false, lockUntil=0;

function autoScroll(top){ lockUntil=Date.now()+1000; window.scrollTo({top,behavior:'smooth'}); }
window.addEventListener('scroll',()=>{
  const st=history.state; if(!st||backing||Date.now()<lockUntil) return;
  if(st.s===0&&DEEP()) history.pushState({t:curTab,s:1},'');
  /* 손으로 다시 맨 위까지 올라오면 쌓아 둔 기록을 걷어서, 다음 뒤로가 헛돌지 않게 한다 */
  else if(st.s===1&&NEARTOP()){ backing=true; history.back(); }
},{passive:true});

let rEls=[], rPos=[], rKey='', rMax=1, rH=1, rT=0, rRaf=0, rDrag=false;
const clamp=v=>Math.min(1,Math.max(0,v));
function railBuild(){
  const pane=panes.querySelector('section.pane.on'), sel=pane&&secOf(pane);
  const vh=window.innerHeight, docH=document.documentElement.scrollHeight, top=navBar.getBoundingClientRect().bottom;
  rMax=docH-vh;
  if(!sel||rMax<vh*.5) return false;
  rail.style.top=(top+10)+'px'; rail.style.bottom='14px'; rH=rail.clientHeight;
  const key=[...panes.children].indexOf(pane)+'|'+docH+'|'+rH;
  if(key!==rKey){
    rKey=key; rEls=[...pane.querySelectorAll(sel)];
    /* 그 구간이 탭 막대 바로 아래에 올 때의 스크롤 위치를 막대 위 비율로 바꾼다 */
    rPos=rEls.map(el=>clamp((el.getBoundingClientRect().top+window.scrollY-top-8)/rMax));
    rDots.innerHTML=rPos.map((f,i)=>`<i class="dt${rEls[i].classList.contains('key')?' k':''}" style="top:${(f*100).toFixed(2)}%"></i>`).join('');
  }
  return true;
}
function railUpdate(){
  const vh=window.innerHeight, f=clamp(window.scrollY/rMax), thH=Math.max(26,rH*vh/(rMax+vh));
  rTh.style.height=thH+'px'; rTh.style.top=(f*(rH-thH))+'px';
  let k=-1; rPos.forEach((p,i)=>{ if(p<=f+.002) k=i; });
  [...rDots.children].forEach((d,i)=>d.classList.toggle('cur',i===k));
  if(rDrag&&k>=0){ const el=rEls[k];
    rLb.innerHTML=el.classList.contains('stop')?`<b>${txt(el.querySelector('.t'))}</b>${esc(el.querySelector('h3').textContent)}`:esc(txt(el));
    rLb.style.top=(f*(rH-thH)+thH/2)+'px'; }
}
function railShow(){

  railUpdate(); rail.classList.add('on');

}
window.addEventListener('scroll',()=>{ if(!rRaf) rRaf=requestAnimationFrame(railShow); },{passive:true});
window.addEventListener('resize',()=>{ rKey=''; });
/* 막대를 누르거나 끌면 그 위치로 바로 옮긴다 */

rail.addEventListener('pointerdown',e=>{ rDrag=true; rail.classList.add('drag'); rail.setPointerCapture(e.pointerId); clearTimeout(rT); scrub(e); e.preventDefault(); });
rail.addEventListener('pointermove',e=>{ if(rDrag) scrub(e); });

window.addEventListener('popstate',e=>{
  const st=e.state; if(!st) return;

/* ───────── 실제 시각 조정 ───────── */
const toMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+m; };
const toHM  = m => { m=((m%1440)+1440)%1440; return `${String(m/60|0).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; };
/* 자기까지의 누적 지연(분). 앞 스톱을 밀면 뒤가 따라 밀리는 근거가 이 누적합이에요. */
const shiftAt = (i,j) => { let s=0; for(let x=0;x<=j;x++) s+=(local.times[`d${i}s${x}`]||{}).d||0; return s; };
const tmAt = el => { const m=/^d(\d+)s(\d+)$/.exec(el.dataset.tm||''); return m?[+m[1],+m[2]]:null; };

function renderTimes(){
  document.querySelectorAll('[data-tm]').forEach(el=>{
    if(el.querySelector('input')) return;
    const at=tmAt(el); if(!at) return;
    const o=DAYS[at[0]].stops[at[1]]; if(!o) return;
    const sh=shiftAt(at[0],at[1]);
    el.innerHTML = sh ? `${toHM(toMin(o.t)+sh)}<s>${o.t}</s>` : o.t;
    el.classList.toggle('adj', !!sh);
  });
}
listeners.times.push(renderTimes);

panes.addEventListener('click', e=>{
  const el=e.target.closest('[data-tm]');
  if(!el || el.querySelector('input')) return;
  const at=tmAt(el); if(!at) return;
  const [i,j]=at, id=`d${i}s${j}`, o=DAYS[i].stops[j];
  const cur=toMin(o.t)+shiftAt(i,j);
  const inp=document.createElement('input');
  inp.type='time'; inp.className='tedit'; inp.value=toHM(cur);
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); if(inp.showPicker) try{ inp.showPicker(); }catch(_){}
  let done=false;
  const close=commit=>{
    if(done) return; done=true;
    const v=inp.value;
    el.innerHTML=''; renderTimes();          // notify 재렌더가 막히지 않도록 입력창부터 걷어내요
    if(!commit || !v) return;
    let diff=toMin(v)-cur;
    diff=((diff+720)%1440+1440)%1440-720;    // 자정 넘김 입력을 ±12시간 안으로 해석
    if(diff) setTime(id, ((local.times[id]||{}).d||0)+diff, ME||'');
  };
  inp.addEventListener('change',()=>close(true));
  inp.addEventListener('blur',()=>close(true));
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Escape') close(false); if(ev.key==='Enter') close(true); });
});

    const send=()=>{ const v=inp.value.trim(); if(!v)return;
      if(!ME){gate.classList.remove('hide');return;} addComment(id,v,ME); inp.value=''; };
    btn.onclick=send; inp.onkeydown=e=>{if(e.key==='Enter')send()};
    th.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delComment(b.dataset.d));
  });
  const all=document.getElementById('allc');
  if(all){
    const cs=local.comments.filter(c=>c.stop!=='board').slice().reverse();
    all.innerHTML=cs.length?cs.map(c=>{
      const [di,si]=c.stop.replace('d','').split('s').map(Number);
      const d=DAYS[di], s=d&&d.stops[si];
      return `<div class="cmt"><span class="who2">${esc(c.by)}<span class="when">${fmt(c.at)}</span></span>
        <div style="font-size:12px;color:var(--muted)">${s?`${d.tab} · ${s.t} ${esc(s.h)}`:''}</div>
        <div>${esc(c.text)}</div></div>`;
    }).join(''):`<div class="empty">일정에 달린 의견이 아직 없습니다.</div>`;
  }
}
listeners.comments.push(renderSocial);
listeners.reactions.push(renderSocial);

(async()=>{
  online = await initDB();
  const st=document.getElementById('status');
  const mode=document.getElementById('mode');
  if(online){ st.textContent=''; if(mode){mode.textContent='함께 보기 모드 — 연결됨';mode.style.color='var(--seto)';} }
  else{ st.textContent='혼자 보기 모드 — 체크와 댓글이 이 기기에만 남습니다';
        if(mode) mode.textContent='혼자 보기 모드 (아직 연결 전)'; }
  renderChecks(); renderSocial(); renderTimes();
  document.querySelectorAll('details[data-map]').forEach(el=>{
    el.addEventListener('toggle',()=>{ if(el.open) drawMaps(+el.dataset.map); });
  });
})();
</script>
