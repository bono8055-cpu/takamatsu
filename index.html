<style>

body{background:var(--paper);color:var(--ink);font-family:'IBM Plex Sans KR',system-ui,sans-serif;

/* 로그인 게이트 */

 border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);white-space:nowrap;transform:translateX(-50%)}
.leaflet-tooltip.plabel{background:none;border:0;border-radius:0;box-shadow:none;padding:0;

.mapcredit{font-size:10.5px;color:var(--hole);margin-top:6px;text-align:right}
.stop .more{border-top:1px dashed var(--line);margin-top:11px}
.stop .more>summary{padding:9px 0;font-size:12.5px;color:var(--seto)}
.spot{margin-top:13px}
.spot figure{margin:0}
.spot img{display:block;width:100%;border:1px solid var(--line)}
.spot .cr{font-size:10px;color:var(--hole);margin:3px 0 5px;text-align:right}
ul.see li{border-top:1px solid var(--line);padding:8px 0}
ul.see .mean{font-size:13px;color:#44453F}
.figt{font:600 12.5px/1 'IBM Plex Sans KR',sans-serif;color:var(--seto);margin:18px 0 7px}
.dfig .body>.figt:first-child{margin-top:2px}
.figleg{list-style:none;margin-top:10px;font-size:12px;color:#44453F}
.figleg li{display:flex;align-items:center;gap:7px;padding:3px 0}

table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.05em}
td:last-child,th:last-child{padding-right:0}
.check{display:flex;gap:9px;padding:9px 0;align-items:flex-start;font-size:13.5px;border-bottom:1px dashed var(--line)}
.check:last-child{border:0}
.check input{margin-top:4px;accent-color:var(--seto);width:16px;height:16px;flex:0 0 auto}
.byline{font-size:11.5px;color:var(--seto);font-weight:500;margin-top:2px}
.big{font-family:'Noto Serif KR',serif;font-size:26px;font-weight:600}
code{font-size:12px;background:var(--panel);padding:1px 5px;border:1px solid var(--line)}
pre{background:var(--panel);border:1px solid var(--line);padding:10px;font-size:11.5px;overflow-x:auto;margin:8px 0;line-height:1.5}
footer{margin-top:44px;padding:20px 0 8px;border-top:2px solid var(--ink);font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:12px 0}
@media(prefers-reduced-motion:no-preference){.pane.on{animation:f .3s ease}}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

<script type="module">
/* ═══════════════════════════════════════════════════
   ① 여기에 Firebase 설정을 붙여넣으세요.
   비워두면 "혼자 보기 모드"로 돌아갑니다 (체크·댓글이 이 기기에만 남음).
   ═══════════════════════════════════════════════════ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC5FPhNXz-cWO6bYHblo1zgadknCaJjwIw",
  authDomain: "takamatsu-2fdbb.firebaseapp.com",
  projectId: "takamatsu-2fdbb",
  storageBucket: "takamatsu-2fdbb.firebasestorage.app",
  messagingSenderId: "985581763677",
  appId: "1:985581763677:web:f8215b97ac61f92c3661b4"
};

/* ② 가족 이름 — 자유롭게 고치세요 */
const MEMBERS = ['아버지','큰 딸','큰 사위','장남','며느리','막내 딸','막내 사위'];

/* ───────── 저장소 계층 ───────── */
const LS = { get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{localStorage.setItem(k,v)}catch(e){}} };
let db=null, F=null, online=false;
const local = { checks:{}, comments:[], reactions:{}, times:{} };
const listeners = { checks:[], comments:[], reactions:[], times:[] };
const notify = k => listeners[k].forEach(f=>f());

async function initDB(){
  if(!FIREBASE_CONFIG.projectId) return false;
  try{
    const a = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const au = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    F = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const app = a.initializeApp(FIREBASE_CONFIG);
    // 익명 로그인 — 사용자는 아무것도 하지 않는다. 외부 접근을 막기 위한 열쇠 역할.
    await au.signInAnonymously(au.getAuth(app));
    db = F.getFirestore(app);
    F.onSnapshot(F.collection(db,'checks'), s=>{
      local.checks={}; s.forEach(d=>local.checks[d.id]=d.data()); notify('checks');
    });
    F.onSnapshot(F.query(F.collection(db,'comments'),F.orderBy('at','asc')), s=>{
      local.comments=[]; s.forEach(d=>local.comments.push({id:d.id,...d.data()})); notify('comments');
    });
    F.onSnapshot(F.collection(db,'reactions'), s=>{
      local.reactions={}; s.forEach(d=>local.reactions[d.id]=d.data()); notify('reactions');
    });
    F.onSnapshot(F.collection(db,'times'), s=>{
      local.times={}; s.forEach(d=>local.times[d.id]=d.data()); notify('times');
    });
    return true;
  }catch(e){ console.warn('Firebase 연결 실패',e); return false; }
}
const now = ()=>Date.now();
async function setCheck(id,on,by){
  if(on) local.checks[id]={by,at:now()}; else delete local.checks[id];
  notify('checks');
  if(!online) return;
  try{ on ? await F.setDoc(F.doc(db,'checks',id),{by,at:now()})
          : await F.deleteDoc(F.doc(db,'checks',id)); }catch(e){console.warn(e)}
}
async function addComment(stop,text,by){
  const o={stop,text,by,at:now()};
  if(!online){ local.comments.push({id:'l'+Math.random(),...o}); notify('comments'); return; }
  try{ await F.addDoc(F.collection(db,'comments'),o); }catch(e){console.warn(e)}
}
async function delComment(id){
  if(!online){ local.comments=local.comments.filter(c=>c.id!==id); notify('comments'); return; }
  try{ await F.deleteDoc(F.doc(db,'comments',id)); }catch(e){console.warn(e)}
}
async function toggleReact(stop,by){
  const id=`${stop}__${by}`;
  const had=!!local.reactions[id];
  if(had) delete local.reactions[id]; else local.reactions[id]={stop,by,at:now()};
  notify('reactions');
  if(!online) return;
  try{ had ? await F.deleteDoc(F.doc(db,'reactions',id))
           : await F.setDoc(F.doc(db,'reactions',id),{stop,by,at:now()}); }catch(e){console.warn(e)}
}
async function setTime(id,d,by){
  if(d) local.times[id]={d,by,at:now()}; else delete local.times[id];
  notify('times');
  if(!online) return;
  try{ d ? await F.setDoc(F.doc(db,'times',id),{d,by,at:now()})
         : await F.deleteDoc(F.doc(db,'times',id)); }catch(e){console.warn(e)}
}

/* ───────── 지도 링크 (Place ID 기반 = 정확) ───────── */
const M = o => o.pid
  ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.q)}&query_place_id=${o.pid}`
  : `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.q)}`;

/* 구간마다 다른 색 — 순서를 색으로도 읽게 한다 */
const LEGC=['#2F6E7E','#8F6F22','#A34A3C','#4F7A46','#6D5091','#35608F','#8C4470','#6B7A2E'];
const MAPS={};

function dayFig(i){
  const d=DAYS[i];
  const body=d.maps.map((m,k)=>{
    const legend=m.path.map(([L,,mode],q)=>`<li><i style="background:${LEGC[q%LEGC.length]}"></i>${L+1} → ${L+2} · ${esc(d.route[L].n)} → ${esc(d.route[L+1].n)}${mode==='s'?'<em>무료 셔틀</em>':mode==='w'?'<em>도보</em>':''}</li>`).join('');
    return (d.maps.length>1?`<h4 class="figt">${esc(m.t)}</h4>`:'')
      +`<div class="lmap" id="lmap${i}_${k}"></div><ul class="figleg">${legend}</ul>`;
  }).join('');
  return `<details class="dfig" data-map="${i}" open><summary>동선 한눈에 보기</summary><div class="body">${body}
  <p class="mapcredit">지도 &copy; Esri &middot; Garmin &middot; OpenStreetMap 기여자</p>
  <p class="mapfoot">선은 실제 도로를 따라 그렸다. 숫자는 그날 전체의 이동 순서이고, 같은 곳을 여러 번 들르면 <b>번호를 모아</b> 붙였다(예: 1·5·7). 점선은 차가 아니라 무료 셔틀이고, 배로 건너는 구간은 선을 긋지 않았다.</p></div></details>`;
}

function drawMaps(i){
  const d=DAYS[i]; if(!d.maps) return;
  d.maps.forEach((m,k)=>{
    const id=i+'_'+k, box=document.getElementById('lmap'+id); if(!box) return;
    if(MAPS[id]){ MAPS[id].invalidateSize(); return; }   // 숨었다 나타나면 크기만 다시 잡는다
    if(typeof L==='undefined'){ box.textContent='지도를 불러오지 못했다. 네트워크를 확인해라.'; return; }
    const map=L.map(box,{dragging:false,touchZoom:false,scrollWheelZoom:false,doubleClickZoom:false,
      boxZoom:false,keyboard:false,zoomControl:false,attributionControl:false});
    MAPS[id]=map;
    /* CARTO는 키 없이 받으면 타일에 "API KEY REQUIRED" 워터마크가 박힌다 */
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
      {maxZoom:19}).addTo(map);
    /* 흰 테두리를 한 겹 깔아 선이 배경에 묻히지 않게 한다 */
    m.path.forEach(([,co])=>L.polyline(co,{color:'#fff',weight:8,opacity:.95,lineCap:'round',lineJoin:'round'}).addTo(map));
    m.path.forEach(([,co,mode],q)=>L.polyline(co,{color:LEGC[q%LEGC.length],weight:4,opacity:1,
      dashArray:mode?'2,7':null,lineCap:'round',lineJoin:'round'}).addTo(map));
    const at=new Map();
    m.idx.forEach(j=>{ const x=d.route[j], key=x.p.ll.join();
      if(!at.has(key)) at.set(key,{ll:x.p.ll,n:x.n,nums:[],rows:[]});
      at.get(key).nums.push(j+1); at.get(key).rows.push(`${j+1}. ${x.t} ${x.r}`); });
    for(const g of at.values()){
      L.marker(g.ll,{icon:L.divIcon({className:'',html:`<div class="pin">${g.nums.join('·')}</div>`,iconSize:null,iconAnchor:[0,13]})})
       .addTo(map)
       .bindTooltip(g.n,{permanent:true,direction:'bottom',offset:[0,15],className:'plabel'})
       .bindPopup(`<b>${esc(g.n)}</b><br>${g.rows.join('<br>')}`);
    }
    map.fitBounds(L.latLngBounds(m.idx.map(j=>d.route[j].p.ll)),{padding:[36,36]});
  });
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=ts=>{const d=new Date(ts);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};

/* 스톱 안쪽 상세는 접어 둔다 — 타임라인을 훑을 때 방해되지 않게 */
function detail(o){
  const body=[
    o.resv?`<div class="resv"><h4>${o.resv.ok?'예약':'예약 없음'}</h4><p>${o.resv.how}</p>
      ${o.resv.links?`<div class="links">${o.resv.links.map(l=>`<a class="go r" href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join('')}</div>`:''}</div>`:'',
    o.see?`<div class="menu"><h4>${o.sl||'여기서 볼 것'}</h4><ul class="see">${o.see.map(x=>
      `<li><div class="mean"><b>${x.n}</b> — ${x.d}</div></li>`).join('')}</ul></div>`:'',
    o.menu?`<div class="menu"><h4>${o.ml||'무엇을 시킬까'}</h4><ul>${o.menu.map(m=>
      `<li><div class="jp">${m.jp}</div><div class="yomi">${m.y}</div><div class="mean">${m.k}</div></li>`).join('')}</ul></div>`:'',
    o.photo?`<div class="menu"><h4>사진 스팟</h4>${o.photo.map(f=>`<div class="spot">
      ${f.img?`<figure><img loading="lazy" src="${f.img}" alt="${f.n}" onerror="this.parentNode.remove()"><figcaption class="cr">${f.cr}</figcaption></figure>`:''}
      <div class="mean"><b>${f.n}</b> — ${f.d}</div>
      <div class="links"><a class="go" href="${M(f)}" target="_blank" rel="noopener">이 지점 지도</a></div></div>`).join('')}</div>`:''
  ].filter(Boolean).join('');
  return body?`<details class="more"><summary>자세히 보기</summary><div class="mbody">${body}</div></details>`:'';
}

function stopBlock(o,id){
  const links=[];
  if(o.map)links.push(`<a class="go" href="${M(o.map)}" target="_blank" rel="noopener">지도</a>`);
  if(o.park)links.push(`<a class="go p" href="${M(o.park)}" target="_blank" rel="noopener">🅿 ${o.park.n}</a>`);
  return `<div class="stop${o.k?' key':''}${o.m?' move':''}" data-id="${id}">
    <div class="t" data-tm="${id}" title="누르면 실제 시각으로 고칠 수 있다. 뒤 일정도 같이 밀린다">${o.t}</div><h3>${o.h}</h3>${o.p?`<p>${o.p}</p>`:''}
    ${o.tags?`<div class="tags">${o.tags.map(t=>`<span class="tag${t.startsWith('⚠')||t.includes('예약 필수')?' w':''}">${t}</span>`).join('')}</div>`:''}
    ${links.length?`<div class="links">${links.join('')}</div>`:''}
    ${detail(o)}
    ${o.m?'':`<div class="bar" data-bar="${id}"></div><div class="thread" data-th="${id}"></div>`}
  </div>`;
}

/* ───────── 체크리스트 ───────── */
/* ───────── 실제 시각 조정 ───────── */
const toMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+m; };
const toHM  = m => { m=((m%1440)+1440)%1440; return `${String(m/60|0).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; };
/* 자기까지의 누적 지연(분). 앞 스톱을 밀면 뒤가 따라 밀리는 근거가 이 누적합이다. */
const shiftAt = (i,j) => { let s=0; for(let x=0;x<=j;x++) s+=(local.times[`d${i}s${x}`]||{}).d||0; return s; };
const tmAt = el => { const m=/^d(\d+)s(\d+)$/.exec(el.dataset.tm||''); return m?[+m[1],+m[2]]:null; };

function renderTimes(){
  document.querySelectorAll('[data-tm]').forEach(el=>{
    if(el.querySelector('input')) return;
    const at=tmAt(el); if(!at) return;
    const o=DAYS[at[0]].stops[at[1]]; if(!o) return;
    const sh=shiftAt(at[0],at[1]);
    el.innerHTML = sh ? `${toHM(toMin(o.t)+sh)}<s>${o.t}</s>` : o.t;
    el.classList.toggle('adj', !!sh);
  });
}
listeners.times.push(renderTimes);

panes.addEventListener('click', e=>{
  const el=e.target.closest('[data-tm]');
  if(!el || el.querySelector('input')) return;
  const at=tmAt(el); if(!at) return;
  const [i,j]=at, id=`d${i}s${j}`, o=DAYS[i].stops[j];
  const cur=toMin(o.t)+shiftAt(i,j);
  const inp=document.createElement('input');
  inp.type='time'; inp.className='tedit'; inp.value=toHM(cur);
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); if(inp.showPicker) try{ inp.showPicker(); }catch(_){}
  let done=false;
  const close=commit=>{
    if(done) return; done=true;
    const v=inp.value;
    el.innerHTML=''; renderTimes();          // notify 재렌더가 막히지 않도록 입력창부터 걷어낸다
    if(!commit || !v) return;
    let diff=toMin(v)-cur;
    diff=((diff+720)%1440+1440)%1440-720;    // 자정 넘김 입력을 ±12시간 안으로 해석
    if(diff) setTime(id, ((local.times[id]||{}).d||0)+diff, ME||'');
  };
  inp.addEventListener('change',()=>close(true));
  inp.addEventListener('blur',()=>close(true));
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Escape') close(false); if(ev.key==='Enter') close(true); });
});

      ${c?`<div class="byline">✓ ${esc(c.by)} · ${fmt(c.at)}</div>`:''}</span></label>`;
  }).join('');
  box.querySelectorAll('input[data-c]').forEach(el=>{
    el.onchange=()=>{ if(!ME){gate.classList.remove('hide');el.checked=!el.checked;return;}
      setCheck(el.dataset.c, el.checked, ME); };

}

function renderSocial(){
  document.querySelectorAll('[data-bar]').forEach(bar=>{
    const id=bar.dataset.bar;
    const cs=local.comments.filter(c=>c.stop===id);
    const rs=Object.values(local.reactions).filter(r=>r.stop===id);
    const mine=rs.some(r=>r.by===ME);
    bar.innerHTML=`<button data-r="${id}" class="${mine?'act':''}">👍 ${rs.length||''}</button>
      <button data-t="${id}">💬 의견 ${cs.length||''}</button>
      ${rs.length?`<span class="cnt">${rs.map(r=>esc(r.by)).join(', ')}</span>`:''}`;
    bar.querySelector('[data-r]').onclick=()=>{ if(!ME){gate.classList.remove('hide');return;} toggleReact(id,ME); };
    bar.querySelector('[data-t]').onclick=()=>{
      document.querySelector(`[data-th="${id}"]`).classList.toggle('on'); };
  });
  document.querySelectorAll('[data-th]').forEach(th=>{
    const id=th.dataset.th;
    const cs=local.comments.filter(c=>c.stop===id);
    th.innerHTML=(cs.length?cs.map(c=>`<div class="cmt">
        <span class="who2">${esc(c.by)}<span class="when">${fmt(c.at)}</span></span>
        ${c.by===ME?`<button class="del" data-d="${c.id}">삭제</button>`:''}
        <div>${esc(c.text)}</div></div>`).join('')
      :`<div class="empty">${id==='board'?'아직 올라온 요청이 없습니다.':'아직 의견이 없습니다.'}</div>`)
     +`<div class="wr"><input placeholder="${id==='board'?'요청이나 의견을 남겨주세요':'이 일정에 대한 의견'}" data-i="${id}">
       <button data-s="${id}">남기기</button></div>`;
    const inp=th.querySelector(`[data-i]`), btn=th.querySelector(`[data-s]`);
    const send=()=>{ const v=inp.value.trim(); if(!v)return;
      if(!ME){gate.classList.remove('hide');return;} addComment(id,v,ME); inp.value=''; };
    btn.onclick=send; inp.onkeydown=e=>{if(e.key==='Enter')send()};
    th.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delComment(b.dataset.d));
  });
  const all=document.getElementById('allc');
  if(all){
    const cs=local.comments.filter(c=>c.stop!=='board').slice().reverse();
    all.innerHTML=cs.length?cs.map(c=>{
      const [di,si]=c.stop.replace('d','').split('s').map(Number);
      const d=DAYS[di], s=d&&d.stops[si];
      return `<div class="cmt"><span class="who2">${esc(c.by)}<span class="when">${fmt(c.at)}</span></span>
        <div style="font-size:12px;color:var(--muted)">${s?`${d.tab} · ${s.t} ${esc(s.h)}`:''}</div>
        <div>${esc(c.text)}</div></div>`;
    }).join(''):`<div class="empty">일정에 달린 의견이 아직 없습니다.</div>`;
  }
}
