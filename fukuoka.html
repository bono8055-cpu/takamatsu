<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>후쿠오카 · 2027.3.5–8</title>
<!-- 글꼴: 프리텐다드(한글 고딕). 일본어는 기기 기본 고딕으로 이어진다 -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
:root{--f:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic','Hiragino Sans','Noto Sans JP',sans-serif;
 --paper:#E6E4DE;--panel:#F3F1EB;--ink:#17181A;--muted:#6E6F6B;
 --seto:#2B4750;--pumpkin:#C9931A;--line:#CBC8BF;--hole:#B4B0A6}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--paper);color:var(--ink);font-family:var(--f);letter-spacing:-.01em;
 font-size:15px;line-height:1.65;padding-bottom:70px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
button{font-family:inherit}

/* 로그인 게이트 */
#gate{position:fixed;inset:0;z-index:100;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
#gate.hide{display:none}
#gate .box{max-width:380px;width:100%}
#gate h2{font-family:var(--f);font-size:26px;font-weight:600;margin-bottom:6px}
#gate p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.who{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.who button{padding:14px 10px;background:var(--panel);border:1px solid var(--line);
 font-size:15px;font-weight:500;cursor:pointer;color:var(--ink)}
.who button:active{background:var(--ink);color:var(--paper)}

.hero{position:relative;padding:20px 0 14px;overflow:hidden}
.hero .panels{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);pointer-events:none}
.hero .panels div{border-right:1px solid rgba(23,24,26,.07);border-bottom:1px solid rgba(23,24,26,.07);position:relative}
.hero .panels div::after{content:"";position:absolute;right:-3px;bottom:-3px;width:6px;height:6px;border-radius:50%;background:var(--hole);opacity:.55}
.eyebrow{position:relative;font-size:10px;letter-spacing:.22em;font-weight:600;color:var(--seto);margin-bottom:4px}
h1{position:relative;font-family:var(--f);font-weight:700;font-size:28px;line-height:1.14;letter-spacing:-.02em;white-space:nowrap}
h1 b{font-weight:600}
.hero .sub1{position:relative;margin-top:4px;color:var(--muted);font-size:12.5px}
.facts{position:relative;display:flex;gap:18px;margin-top:18px;flex-wrap:wrap}
.facts div span{display:block;font-size:10.5px;letter-spacing:.1em;color:var(--muted);font-weight:500}
.facts div strong{font-family:var(--f);font-weight:600;font-size:17px}
#me{position:relative;margin-top:8px;font-size:12px;color:var(--muted)}
#me b{color:var(--ink)}
#me button{background:none;border:0;border-bottom:1px solid var(--muted);color:var(--muted);font-size:12px;cursor:pointer;padding:0 0 1px;margin-left:8px}
#me .trip{color:var(--seto);font-weight:600;margin-left:8px;text-decoration:none;border-bottom:1px solid var(--seto)}
/* 여행 고르기 — 큰 사위에게만 뜬다 */
#tripPick{position:fixed;inset:0;z-index:101;background:var(--paper);display:flex;align-items:center;justify-content:center;padding:24px}
#tripPick.hide{display:none}
#tripPick .box{max-width:380px;width:100%}
#tripPick h2{font-family:var(--f);font-size:26px;font-weight:600;margin-bottom:6px}
#tripPick p{color:var(--muted);font-size:13.5px;margin-bottom:22px}
#tripPick .who button{line-height:1.4}
#tripPick .who small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
#status{position:relative;margin-top:4px;font-size:11.5px;color:var(--pumpkin)}

nav{position:sticky;top:0;z-index:20;background:rgba(230,228,222,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding:9px 14px}
nav .wrap::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;font:500 13px/1 var(--f);color:var(--muted);background:none;border:0;padding:9px 13px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--ink);color:var(--paper)}
/* 오른쪽 가장자리 스크롤 막대 — 구간마다 점을 찍고 손가락으로 끌어 옮긴다. 거의 본문 여백(18px) 안에 떠서 글자를 가리지 않는다 */
#srail{position:fixed;right:0;width:24px;z-index:25;opacity:0;pointer-events:none;transition:opacity .3s;touch-action:none}
#srail.on{opacity:1;pointer-events:auto}
#srail .ln{position:absolute;right:10px;top:0;bottom:0;width:4px;border-radius:2px;background:rgba(23,24,26,.18)}
#srail .dt{position:absolute;z-index:1;right:9px;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:#9A9992}
#srail .dt.k{right:8px;width:8px;height:8px;margin-top:-4px;background:var(--seto)}
#srail .dt.cur{right:6px;width:12px;height:12px;margin-top:-6px;z-index:2;background:var(--pumpkin);box-shadow:0 0 0 3px rgba(201,147,26,.28)}
#srail .th{position:absolute;z-index:0;right:5px;width:14px;min-height:26px;border-radius:7px;background:rgba(23,24,26,.42)}
#srail .lb{display:none;position:absolute;right:30px;transform:translateY(-50%);max-width:72vw;padding:5px 11px;border-radius:999px;
 background:rgba(23,24,26,.88);color:#F3F1EB;font-size:12px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#srail .lb b{color:#E7C46A;font-weight:600;margin-right:6px}
#srail.drag .lb{display:block}
/* 일정 길게 누르기 → 공유 메뉴 */
.stop{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.stop .menu,.stop .menu *,.stop input,.stop textarea{-webkit-user-select:text;user-select:text}
.stop.hold{background:rgba(201,147,26,.10);transition:background .2s}
#shsheet{position:fixed;inset:0;z-index:60;display:none;background:rgba(23,24,26,.35)}
#shsheet.on{display:block}
#shsheet .box{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--panel);
 border-top:2px solid var(--ink);padding:16px 18px calc(16px + env(safe-area-inset-bottom))}
#shsheet h4{font-size:15px;font-weight:600;line-height:1.4}
#shsheet .sub{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
#shsheet button{display:block;width:100%;font:600 15px/1 var(--f);padding:14px;margin-top:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
#shsheet button.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:70;padding:9px 16px;border-radius:999px;
 background:rgba(23,24,26,.9);color:#F3F1EB;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.on{opacity:1}
/* 운전 탭 — 막내 사위에게만 보인다 */
nav button.drv{color:#1F6F4A;font-weight:600}
nav button.drv.on{background:#1F6F4A;color:#fff}
.dvhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-top:2px solid var(--ink);padding-top:10px}
.dvhead h2{font-size:20px;font-weight:700}
.dvhead em{font-style:normal;font-size:12px;color:var(--muted)}
.dvlist{margin-top:4px}
.dvlist a{display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 10px;margin-top:1px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-decoration:none}
.dvlist a b{flex:none;width:44px;font-size:13px;color:var(--seto)}
.dvlist a span{flex:1;font-size:15px;font-weight:600;line-height:1.25}
.dvlist a span i{display:block;font-style:normal;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:2px}
.dvlist a em{flex:none;font-style:normal;font-size:12px;font-weight:600;color:#fff;background:#1F6F4A;padding:7px 9px}
.dvlist a.next{border:2px solid #1F6F4A;background:#EEF5EF}
.dvlist .ferry{font-size:12px;color:var(--muted);padding:5px 10px 0 64px}
.dvfoot{font-size:11.5px;color:var(--muted);margin-top:10px;line-height:1.5}
/* 공유 링크로 들어오면 그 일정 하나만 보여준다 */
body.solo section.pane.on .stop:not(.solo-on),body.solo section.pane.on .dfig,body.solo section.pane.on .note,body.solo section.pane.on .swap,body.solo #srail{display:none!important}
.solobar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0 4px;padding:10px 12px;background:var(--panel);border-left:2px solid var(--pumpkin);font-size:13px;color:#3A3B38}
.solobar button{flex:none;font:600 13px/1 var(--f);padding:9px 12px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}

.pane{display:none;padding-top:24px}
.pane.on{display:block}
.dayhead{border-top:2px solid var(--ink);padding-top:12px}
.dayhead h2{font-family:var(--f);font-weight:600;font-size:22px;letter-spacing:-.01em}
.dayhead em{font-style:normal;color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.note{background:var(--panel);border-left:2px solid var(--pumpkin);padding:11px 13px;font-size:13px;margin:15px 0 0;color:#3A3B38}

.rail{position:relative;padding-left:26px;margin-top:20px}
.rail::before{content:"";position:absolute;left:5px;top:8px;bottom:14px;width:1px;background:var(--line)}
.stop{position:relative;padding:0 0 24px}
.stop::before{content:"";position:absolute;left:-24px;top:7px;width:11px;height:11px;border-radius:50%;background:var(--paper);border:1px solid var(--hole)}
.stop.key::before{background:var(--pumpkin);border-color:var(--pumpkin)}
.stop.move::before{width:5px;height:5px;left:-21px;top:10px;background:var(--hole);border:0}
.t{font:600 12px/1 var(--f);letter-spacing:.04em;color:var(--seto)}
.stop h3{font-size:15.5px;font-weight:600;margin:5px 0 3px;letter-spacing:-.01em}
.stop p{font-size:13.5px;color:#44453F}
.stop.move .t{color:var(--muted)}
.stop .t[data-tm]{cursor:pointer;border-bottom:1px dotted var(--hole);display:inline-block;padding-bottom:2px}
.stop .t.adj{color:var(--pumpkin);border-bottom-color:var(--pumpkin)}
.stop .t s{opacity:.45;font-weight:400;margin-left:5px}
.tedit{font:600 12px/1 var(--f);color:var(--seto);background:var(--paper);border:1px solid var(--hole);padding:2px 4px}
.stop.move p{font-size:13px;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.tag{font-size:11.5px;font-weight:500;padding:3px 7px;background:var(--panel);border:1px solid var(--line);color:#55564F}
.tag.w{border-color:var(--pumpkin);color:#8A6404}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px}
a.go{font-size:12.5px;font-weight:500;color:var(--seto);text-decoration:none;border-bottom:1px solid var(--seto);padding-bottom:1px}
a.go.p{color:#7A6320;border-color:#7A6320}
a.go.d{color:#1F6F4A;border-color:#1F6F4A;font-weight:600}

.resv{margin-top:12px;border:1px solid var(--seto);border-left-width:2px;padding:9px 12px}
.resv h4{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--seto);margin-bottom:3px}
.resv p{font-size:13px;color:#44453F}
.resv .links{margin-top:8px}
a.go.r{color:var(--seto);border-color:var(--seto)}
.menu{margin-top:12px;border:1px solid var(--line);background:var(--panel)}
.menu h4{font-size:11px;letter-spacing:.14em;font-weight:600;color:var(--muted);padding:9px 12px 0}
.menu ul{list-style:none;padding:6px 12px 11px}
.menu li{padding:7px 0;border-bottom:1px dashed var(--line)}
.menu li:last-child{border:0;padding-bottom:0}
.jp{font-size:14px;font-weight:600}
.yomi{font-size:13px;color:var(--seto);font-weight:500}
.mean{font-size:12.5px;color:var(--muted)}

/* 반응 · 댓글 */
.bar{display:flex;gap:8px;margin-top:11px;align-items:center;flex-wrap:wrap}
.bar button{font-size:12px;font-weight:500;padding:5px 10px;background:none;border:1px solid var(--line);color:var(--muted);cursor:pointer}
.bar button.act{border-color:var(--seto);color:var(--seto);background:var(--panel)}
.bar .cnt{font-size:11.5px;color:var(--muted)}
.thread{margin-top:10px;border-left:2px solid var(--line);padding-left:11px;display:none}
.thread.on{display:block}
.cmt{padding:7px 0;border-bottom:1px dashed var(--line);font-size:13.5px}
.cmt:last-of-type{border:0}
.cmt .who2{font-size:11.5px;color:var(--seto);font-weight:600}
.cmt .when{font-size:11px;color:var(--muted);font-weight:400;margin-left:6px}
.cmt .del{float:right;background:none;border:0;color:var(--muted);font-size:11px;cursor:pointer;padding:0}
.wr{display:flex;gap:6px;margin-top:9px}
.wr input{flex:1;min-width:0;font:400 13.5px var(--f);padding:8px 10px;
 border:1px solid var(--line);background:var(--paper);color:var(--ink)}
.wr button{padding:8px 13px;background:var(--ink);color:var(--paper);border:0;font-size:13px;font-weight:500;cursor:pointer}

details{border-top:1px solid var(--line)}
details summary{list-style:none;cursor:pointer;padding:15px 0;font-weight:600;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";font-weight:400;font-size:18px;color:var(--muted)}
details[open] summary::after{content:"−"}
details .body{padding-bottom:20px;font-size:13.5px;color:#44453F}
.lmap{height:360px;border:1px solid var(--line);background:#F7F6F2;cursor:default}
.pin{display:flex;align-items:center;justify-content:center;height:24px;min-width:24px;padding:0 6px;
 border-radius:12px;background:#17181A;color:#fff;font:700 12px/1 var(--f);
 border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.28);white-space:nowrap}
.gpin{position:absolute;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-12px);cursor:pointer}
.gpin .plabel{margin-top:2px;white-space:nowrap;color:#1F2023;font:600 11.5px/1.2 var(--f);
 text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.swap{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.swap b{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.swap button{font:inherit;font-size:12.5px;padding:5px 10px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer}
.swap button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.cday{margin:26px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.cday h3{font-family:var(--f);font-size:17px;font-weight:600;display:inline}
.cday em{font-size:12.5px;color:var(--muted);font-style:normal;margin-left:8px}
.cafe{border:1px solid var(--line);background:var(--panel);padding:13px;margin-bottom:11px}
.cafe.cur{border-left:2px solid var(--pumpkin)}
.cafe h4{font-size:15px;font-weight:600}
.cin{font-size:11px;font-weight:500;color:#8A6404;margin-left:7px}
.cjp{font-size:12px;color:var(--muted);margin-bottom:8px}
.ctb{width:100%;font-size:12.5px}
.ctb td{padding:3px 0;vertical-align:top}
.ctb td:first-child{width:74px;color:var(--muted);white-space:nowrap}
.cno{font-size:12.5px;color:#3A3B38;margin-top:8px;line-height:1.6}
.cntb{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
.cntb th,.cntb td{border:1px solid var(--line);padding:5px 4px;text-align:center;vertical-align:middle}
.cntb thead th{background:var(--panel);font-weight:600;font-size:12px;color:var(--muted)}
.cntb tbody th{width:26px;color:var(--muted);font-weight:600}
.cntb td i{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:1px}
.cntb tr.hl td,.cntb tr.hl th{background:#FBF3DF}
.ctb td.cpay{color:#8A6404;font-weight:600}
.slack{background:var(--panel);border-left:2px solid var(--pumpkin);padding:8px 10px;
 font-size:12.5px;color:#3A3B38;line-height:1.55;margin-top:10px}
.slack b{color:#8A6404}
.stop .more{border-top:1px dashed var(--line);margin-top:11px}
.stop .more>summary{padding:9px 0;font-size:12.5px;color:var(--seto)}
.spot{margin-top:13px}
.spot figure{margin:0}
.spot img{display:block;width:100%;border:1px solid var(--line)}
.spot .cr{font-size:10px;color:var(--hole);margin:3px 0 5px;text-align:right}
ul.see li{border-top:1px solid var(--line);padding:8px 0}
ul.see .mean{font-size:13px;color:#44453F}
.figt{font:600 12.5px/1 var(--f);color:var(--seto);margin:18px 0 7px}
/* 런닝 */
.rart{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#EFE6D4;border:1px solid var(--line);margin-top:14px}
.run{border:1px solid var(--line);background:var(--panel);margin-top:18px}
.run .rart{border:0;border-bottom:1px solid var(--line);margin:0}
.run .rb{padding:13px}
.run h3{font-family:var(--f);font-size:17px;font-weight:600;line-height:1.4}
.rlv{display:inline-block;font:600 11px/1 var(--f);padding:4px 7px;margin-right:6px;vertical-align:2px;color:#fff;background:var(--seto)}
.rlv.mid{background:#B8432F}
.rlv.easy{background:#4F7A46}
.rkm{font-size:13px;color:var(--muted);margin:4px 0 8px}
.rkm b{color:var(--ink);font-size:15px}
.run .dfig{margin-top:10px}
.dfig .body>.figt:first-child{margin-top:2px}
.figleg{list-style:none;margin-top:10px;font-size:12px;color:#44453F}
.figleg li{display:flex;align-items:center;gap:7px;padding:3px 0}
.figleg i{width:14px;height:3px;flex:none;border-radius:2px}
.figleg em{font-style:normal;color:var(--muted);font-size:11px;margin-left:5px}
.mapfoot{font-size:12px;color:var(--muted);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 6px 7px 0;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:11px;letter-spacing:.05em}
td:last-child,th:last-child{padding-right:0}
.check{display:flex;gap:9px;padding:9px 0;align-items:flex-start;font-size:13.5px;border-bottom:1px dashed var(--line)}
.check:last-child{border:0}
.check input{margin-top:4px;accent-color:var(--seto);width:16px;height:16px;flex:0 0 auto}
.byline{font-size:11.5px;color:var(--seto);font-weight:500;margin-top:2px}
.big{font-family:var(--f);font-size:26px;font-weight:600}
code{font-size:12px;background:var(--panel);padding:1px 5px;border:1px solid var(--line)}
pre{background:var(--panel);border:1px solid var(--line);padding:10px;font-size:11.5px;overflow-x:auto;margin:8px 0;line-height:1.5}
footer{margin-top:44px;padding:20px 0 8px;border-top:2px solid var(--ink);font-size:11.5px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:12px 0}
@media(prefers-reduced-motion:no-preference){.pane.on{animation:f .3s ease}}
@keyframes f{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>

<div id="gate"><div class="box">
  <h2>누구세요?</h2>
  <p>이름을 고르면 됩니다. 비밀번호는 없어요.<br>체크와 댓글에 이 이름이 남습니다.</p>
  <div class="who" id="who"></div>
</div></div>

<div id="tripPick" class="hide"><div class="box">

const listeners = { checks:[], comments:[], reactions:[], times:[] };
const notify = k => listeners[k].forEach(f=>f());

async function initDB(){
  if(!FIREBASE_CONFIG.projectId) return false;
  try{
    const a = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js');
    const au = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js');
    F = await import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js');
    const app = a.initializeApp(FIREBASE_CONFIG);
    // 익명 로그인 — 사용자는 아무것도 하지 않아요. 외부 접근을 막기 위한 열쇠 역할.
    await au.signInAnonymously(au.getAuth(app));
    db = F.getFirestore(app);
    F.onSnapshot(F.collection(db,'checks'), s=>{
      local.checks={}; s.forEach(d=>local.checks[d.id]=d.data()); notify('checks');
    });
    F.onSnapshot(F.query(F.collection(db,'comments'),F.orderBy('at','asc')), s=>{
      local.comments=[]; s.forEach(d=>local.comments.push({id:d.id,...d.data()})); notify('comments');
    });
    F.onSnapshot(F.collection(db,'reactions'), s=>{
      local.reactions={}; s.forEach(d=>local.reactions[d.id]=d.data()); notify('reactions');
    });
    F.onSnapshot(F.collection(db,'times'), s=>{
      local.times={}; s.forEach(d=>local.times[d.id]=d.data()); notify('times');
    });
    return true;
  }catch(e){ console.warn('Firebase 연결 실패',e); return false; }
}
const now = ()=>Date.now();
async function setCheck(id,on,by){

  try{ on ? await F.setDoc(F.doc(db,'checks',id),{by,at:now()})
          : await F.deleteDoc(F.doc(db,'checks',id)); }catch(e){console.warn(e)}
}
async function addComment(stop,text,by){
  const o={stop,text,by,at:now()};
  if(!online){ local.comments.push({id:'l'+Math.random(),...o}); notify('comments'); return; }
  try{ await F.addDoc(F.collection(db,'comments'),o); }catch(e){console.warn(e)}
}
async function delComment(id){
  if(!online){ local.comments=local.comments.filter(c=>c.id!==id); notify('comments'); return; }
  try{ await F.deleteDoc(F.doc(db,'comments',id)); }catch(e){console.warn(e)}
}
async function toggleReact(stop,by){

           : await F.setDoc(F.doc(db,'reactions',id),{stop,by,at:now()}); }catch(e){console.warn(e)}
}
async function setTime(id,d,by){

/* 구글 지도 — 한국어 지명으로 띄운다. 키는 bono8055-cpu.github.io 에서만 쓰이도록 제한돼 있다 */
const GMAPS_KEY='AIzaSyACqk-wX4FLjgAZzIlF3U35PgDlbn3PaOY';
let gmReady=null;
function loadGmaps(){
  if(gmReady) return gmReady;
  gmReady=new Promise((ok,no)=>{
    window.__gmInit=async()=>{ try{
      const [maps,core]=await Promise.all([google.maps.importLibrary('maps'),google.maps.importLibrary('core')]);
      /* 번호 핀과 이름을 한 덩어리 HTML로 얹는다 */
      class Pin extends maps.OverlayView{
        constructor(pos,html,onTap){ super(); this.pos=pos; this.el=document.createElement('div'); this.el.className='gpin'; this.el.innerHTML=html; this.el.addEventListener('click',onTap); }
        onAdd(){ this.getPanes().overlayMouseTarget.appendChild(this.el); }
        draw(){ const p=this.getProjection().fromLatLngToDivPixel(this.pos); this.el.style.left=p.x+'px'; this.el.style.top=p.y+'px'; }
        onRemove(){ this.el.remove(); }
      }
      ok({...maps,...core,Pin});
    }catch(e){ no(e); } };
    const sc=document.createElement('script');
    sc.src=`https://maps.googleapis.com/maps/api/js?key=${GMAPS_KEY}&language=ko&region=JP&loading=async&callback=__gmInit`;
    sc.async=true; sc.onerror=()=>no(new Error('load')); document.head.appendChild(sc);
  });
  return gmReady;
}

function drawMaps(i){

    MAPS[id]=1;
    loadGmaps().then(gm=>{ MAPS[id]=makeMap(gm,d,m,box); })
      .catch(()=>{ delete MAPS[id]; box.textContent='지도를 불러오지 못했어요. 네트워크를 확인해 주세요.'; });
  });
}

function makeMap(gm,d,m,box){
  /* 처음 크기에서는 한 손가락이 페이지 스크롤이고 두 손가락으로 확대 · 이동한다 */
  const map=new gm.Map(box,{disableDefaultUI:true,clickableIcons:false,keyboardShortcuts:false,
    gestureHandling:'cooperative',mapTypeId:'roadmap',
    styles:[{featureType:'poi.business',stylers:[{visibility:'off'}]}]});
  /* 흰 테두리를 한 겹 깔아 선이 지도에 묻히지 않게 한다. 선 굵기는 화면 픽셀이라 확대해도 그대로다 */
  m.path.forEach(([,co,mode],q)=>{
    const path=co.map(([la,ln])=>({lat:la,lng:ln})), col=LEGC[q%LEGC.length];
    new gm.Polyline({map,path,clickable:false,zIndex:1,strokeColor:'#fff',strokeOpacity:.95,strokeWeight:8});
    new gm.Polyline({map,path,clickable:false,zIndex:2,...(mode
      ? {strokeOpacity:0,icons:[{icon:{path:google.maps.SymbolPath.CIRCLE,scale:2,fillColor:col,fillOpacity:1,strokeOpacity:0},offset:'0',repeat:'9px'}]}
      : {strokeColor:col,strokeOpacity:1,strokeWeight:4})});
  });
  const at=new Map();
  m.idx.forEach(j=>{ const x=d.route[j], key=x.p.ll.join();
    if(!at.has(key)) at.set(key,{ll:x.p.ll,n:x.n,nums:[],rows:[]});
    at.get(key).nums.push(j+1); at.get(key).rows.push(`${j+1}. ${x.t} ${x.r}`); });
  const iw=new gm.InfoWindow();
  const bounds=new gm.LatLngBounds();
  for(const g of at.values()){
    const pos=new gm.LatLng(g.ll[0],g.ll[1]); bounds.extend(pos);
    new gm.Pin(pos,`<div class="pin">${g.nums.join('·')}</div><div class="plabel">${esc(g.n)}</div>`,
      ()=>{ iw.setContent(`<b>${esc(g.n)}</b><br>${g.rows.join('<br>')}`); iw.setPosition(pos); iw.open({map}); }).setMap(map);
  }
  map.fitBounds(bounds,36);
  /* 처음 크기보다 작게는 줄지 않는다. 확대했을 때만 한 손가락으로 지도를 옮기고, 처음 크기로 돌아오면 제자리로 되돌린다 */
  google.maps.event.addListenerOnce(map,'idle',()=>{
    const z0=map.getZoom(), home=map.getCenter();
    map.setOptions({minZoom:z0});
    map.addListener('zoom_changed',()=>{
      if(map.getZoom()>z0) map.setOptions({gestureHandling:'greedy'});
      else { map.setOptions({gestureHandling:'cooperative'}); map.setCenter(home); }
    });
  });
  return map;
}

const TRIP_PICKER='큰 사위', TRIP_HERE='fk', tripPick=document.getElementById('tripPick');
const SS={ get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}} };
function askTrip(force){
  if(ME!==TRIP_PICKER){ tripPick.classList.add('hide'); return; }
  if(force||!SS.get('tripPicked')) tripPick.classList.remove('hide');
}
tripPick.addEventListener('click',e=>{
  const b=e.target.closest('[data-trip]'); if(!b) return;
  SS.set('tripPicked','1');
  if(b.dataset.trip!==TRIP_HERE){ location.href=b.dataset.trip==='fk'?'fukuoka.html':'./?trip=tk'; return; }
  tripPick.classList.add('hide');
});

function detail(o){
  const body=[
    o.resv?`<div class="resv"><h4>${o.resv.ok?'예약':'예약 없음'}</h4><p>${o.resv.how}</p>
      ${o.resv.links?`<div class="links">${o.resv.links.map(l=>`<a class="go r" href="${l.u}" target="_blank" rel="noopener">${l.t}</a>`).join('')}</div>`:''}</div>`:'',
    o.see?`<div class="menu"><h4>${o.sl||'여기서 볼 것'}</h4><ul class="see">${o.see.map(x=>
      `<li><div class="mean"><b>${x.n}</b> — ${x.d}</div></li>`).join('')}</ul></div>`:'',
    o.menu?`<div class="menu"><h4>${o.ml||'무엇을 시킬까요'}</h4><ul>${o.menu.map(m=>
      `<li><div class="jp">${m.jp}</div><div class="yomi">${m.y}</div><div class="mean">${m.k}</div></li>`).join('')}</ul></div>`:'',
    o.photo?`<div class="menu"><h4>사진 스팟</h4>${o.photo.map(f=>`<div class="spot">
      ${f.img?`<figure><img loading="lazy" src="${f.img}" alt="${f.n}" onerror="this.parentNode.remove()"><figcaption class="cr">${f.cr}</figcaption></figure>`:''}
      <div class="mean"><b>${f.n}</b> — ${f.d}</div>
      <div class="links"><a class="go" href="${M(f)}" target="_blank" rel="noopener">이 지점 지도</a></div></div>`).join('')}</div>`:''
  ].filter(Boolean).join('');
  return body?`<details class="more"><summary>자세히 보기</summary><div class="mbody">${body}</div></details>`:'';
}

function stopBlock(o,id,mode){
  const links=[];
  if(o.map)links.push(`<a class="go" href="${M(o.map)}" target="_blank" rel="noopener">지도</a>`);
  /* 배로 건너는 칸 · 앞에 이동 칸이 없는 칸은 길찾기를 달지 않는다. dir 이 있으면 그곳으로, 차로 가는 곳에 주차장이 있으면 주차장으로 안내한다 */
  if(o.map&&mode&&!o.h.startsWith('⛴')){ const to=o.dir||(mode==='driving'&&o.park?o.park:o.map);
    links.push(`<a class="go d" href="${DIR(to,mode)}" target="_blank" rel="noopener">${DIRLABEL[mode]}</a>`); }
  if(o.park)links.push(`<a class="go p" href="${M(o.park)}" target="_blank" rel="noopener">🅿 ${o.park.n}</a>`);
  return `<div class="stop${o.k?' key':''}${o.m?' move':''}" data-id="${id}">
    <div class="t" data-tm="${id}" title="누르면 실제 시각으로 고칠 수 있어요. 뒤 일정도 같이 밀려요">${o.t}</div><h3>${o.h}</h3>${o.p?`<p>${o.p}</p>`:''}
    ${o.tags?`<div class="tags">${o.tags.map(t=>`<span class="tag${t.startsWith('⚠')||t.includes('예약 필수')||t.includes('현금')?' w':''}">${t}</span>`).join('')}</div>`:''}
    ${links.length?`<div class="links">${links.join('')}</div>`:''}
    ${o.slack?`<div class="slack"><b>늦어지면</b> ${o.slack}</div>`:''}
    ${detail(o)}
    ${o.m?'':`<div class="bar" data-bar="${id}"></div><div class="thread" data-th="${id}"></div>`}
  </div>`;
}

nav.insertAdjacentHTML('beforeend','<button data-i="board">요청</button>');
nav.insertAdjacentHTML('beforeend','<button data-i="info">정보</button>');
const extra={cafe:cafePane,ramen:ramenPane,jp:jpPane,run:runPane,board:boardPane,info:infoPane};
function showTab(key){
  const b=nav.querySelector('button[data-i="'+key+'"]'); if(!b) return;
  [...nav.children].forEach(x=>x.classList.remove('on')); b.classList.add('on');
  [...panes.children].forEach(s=>s.classList.remove('on'));
  const shown=(extra[key]||panes.children[satPane(+key)]);
  shown.classList.add('on');
  shown.querySelectorAll('details[data-map]').forEach(el=>{ if(el.open) drawMaps(+el.dataset.map); });
  autoScroll(nav.offsetTop-1);
}
/* 폰의 뒤로 버튼 — 탭을 옮길 때마다 기록을 하나 쌓는다.
   탭 안에서 아래로 내려가 있으면 기록을 하나 더 쌓아서, 뒤로를 누르면 먼저 맨 위로 올라가고 한 번 더 누르면 이전 탭으로 간다 */
let curTab=(nav.querySelector('button.on')||nav.children[0]).dataset.i;
/* nav 는 고정 막대 안쪽 요소라 offsetTop 이 늘 0 이다. 기준은 일정 본문이 시작하는 높이로 잡는다 */
const DEEP=()=>window.scrollY>panes.offsetTop+300, NEARTOP=()=>window.scrollY<panes.offsetTop;
if('scrollRestoration' in history) history.scrollRestoration='manual';   // 뒤로 갈 때 브라우저가 예전 스크롤 위치로 되돌리지 않게 한다
history.replaceState({t:curTab,s:0},'');
nav.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  const key=b.dataset.i;
  if(key!==curTab){ curTab=key; history.pushState({t:key,s:0},''); }
  showTab(key);
});
let backing=false, lockUntil=0;
/* 앱이 스스로 스크롤하는 동안에는 기록을 쌓지 않는다 */
function autoScroll(top){ lockUntil=Date.now()+1000; window.scrollTo({top,behavior:'smooth'}); }
window.addEventListener('scroll',()=>{
  const st=history.state; if(!st||backing||Date.now()<lockUntil) return;
  if(st.s===0&&DEEP()) history.pushState({t:curTab,s:1},'');
  /* 손으로 다시 맨 위까지 올라오면 쌓아 둔 기록을 걷어서, 다음 뒤로가 헛돌지 않게 한다 */
  else if(st.s===1&&NEARTOP()){ backing=true; history.back(); }
},{passive:true});
/* 오른쪽 점 스크롤 막대 — 스크롤하면 나타나고 1.5초 뒤 사라진다. 점은 구간(일정 · 묶음 · 코스) 위치, 큰 점은 핵심 일정, 주황 점은 지금 구간 */
const navBar=document.querySelector('nav');
const secOf=pane=>pane===jpPane?'.jph':pane===runPane?'.run h3':pane===cafePane||pane===ramenPane?'.cafe h4':pane===infoPane?'details>summary':pane===boardPane?null:'.stop:not(.move)';
const txt=el=>(el.firstChild&&el.firstChild.nodeType===3?el.firstChild.textContent:el.textContent).trim();
const rail=document.createElement('div'); rail.id='srail';
rail.innerHTML='<div class="ln"></div><div class="dots"></div><div class="th"></div><div class="lb"></div>';
document.body.appendChild(rail);
const rDots=rail.querySelector('.dots'), rTh=rail.querySelector('.th'), rLb=rail.querySelector('.lb');
let rEls=[], rPos=[], rKey='', rMax=1, rH=1, rT=0, rRaf=0, rDrag=false;
const clamp=v=>Math.min(1,Math.max(0,v));
function railBuild(){
  const pane=panes.querySelector('section.pane.on'), sel=pane&&secOf(pane);
  const vh=window.innerHeight, docH=document.documentElement.scrollHeight, top=navBar.getBoundingClientRect().bottom;
  rMax=docH-vh;
  if(!sel||rMax<vh*.5) return false;
  rail.style.top=(top+10)+'px'; rail.style.bottom='14px'; rH=rail.clientHeight;
  const key=[...panes.children].indexOf(pane)+'|'+docH+'|'+rH;
  if(key!==rKey){
    rKey=key; rEls=[...pane.querySelectorAll(sel)];
    /* 그 구간이 탭 막대 바로 아래에 올 때의 스크롤 위치를 막대 위 비율로 바꾼다 */
    rPos=rEls.map(el=>clamp((el.getBoundingClientRect().top+window.scrollY-top-8)/rMax));
    rDots.innerHTML=rPos.map((f,i)=>`<i class="dt${rEls[i].classList.contains('key')?' k':''}" style="top:${(f*100).toFixed(2)}%"></i>`).join('');
  }
  return true;
}
function railUpdate(){
  const vh=window.innerHeight, f=clamp(window.scrollY/rMax), thH=Math.max(26,rH*vh/(rMax+vh));
  rTh.style.height=thH+'px'; rTh.style.top=(f*(rH-thH))+'px';
  let k=-1; rPos.forEach((p,i)=>{ if(p<=f+.002) k=i; });
  [...rDots.children].forEach((d,i)=>d.classList.toggle('cur',i===k));
  if(rDrag&&k>=0){ const el=rEls[k];
    rLb.innerHTML=el.classList.contains('stop')?`<b>${txt(el.querySelector('.t'))}</b>${esc(el.querySelector('h3').textContent)}`:esc(txt(el));
    rLb.style.top=(f*(rH-thH)+thH/2)+'px'; }
}
function railShow(){
  rRaf=0;
  if(!railBuild()){ rail.classList.remove('on'); return; }
  railUpdate(); rail.classList.add('on');
  clearTimeout(rT); if(!rDrag) rT=setTimeout(()=>rail.classList.remove('on'),1500);
}
window.addEventListener('scroll',()=>{ if(!rRaf) rRaf=requestAnimationFrame(railShow); },{passive:true});
window.addEventListener('resize',()=>{ rKey=''; });
/* 막대를 누르거나 끌면 그 위치로 바로 옮긴다 */
const scrub=e=>{ const r=rail.getBoundingClientRect(); window.scrollTo({top:clamp((e.clientY-r.top)/r.height)*rMax,behavior:'instant'}); };
rail.addEventListener('pointerdown',e=>{ rDrag=true; rail.classList.add('drag'); rail.setPointerCapture(e.pointerId); clearTimeout(rT); scrub(e); e.preventDefault(); });
rail.addEventListener('pointermove',e=>{ if(rDrag) scrub(e); });
const endDrag=()=>{ if(!rDrag) return; rDrag=false; rail.classList.remove('drag'); clearTimeout(rT); rT=setTimeout(()=>rail.classList.remove('on'),1500); };
rail.addEventListener('pointerup',endDrag); rail.addEventListener('pointercancel',endDrag);
window.addEventListener('popstate',e=>{
  const st=e.state; if(!st) return;
  if(backing){ backing=false; return; }
  /* 다른 탭으로 돌아오면 그 탭 맨 위에서 보여준다. 그 탭의 '아래로 내려가 있던' 기록은 바로 걷어서 한 번 더 누르면 그 이전 탭으로 간다 */
  if(st.t!==curTab){ curTab=st.t; showTab(st.t); if(st.s===1){ backing=true; history.back(); } return; }
  if(st.s===0) autoScroll(0);
});

/* ───────── 일정 길게 누르기 → 공유 ─────────
   폰 브라우저는 손을 뗀 다음의 '탭'이 있어야 공유창을 열어 준다. 그래서 길게 누르면 메뉴를 띄우고, 메뉴의 버튼을 누를 때 공유한다 */
const APPURL='https://bono8055-cpu.github.io/takamatsu/fukuoka.html';
const plain=h=>{ const d=document.createElement('div'); d.innerHTML=h||''; return d.textContent.replace(/\s+/g,' ').trim(); };
const sheet=document.createElement('div'); sheet.id='shsheet';
sheet.innerHTML='<div class="box"><h4></h4><div class="sub"></div><button class="pri" data-act="share">공유하기</button><button data-act="copy">내용 복사</button><button data-act="close">닫기</button></div>';
document.body.appendChild(sheet);
const toastEl=document.createElement('div'); toastEl.id='toast'; document.body.appendChild(toastEl);
const toast=t=>{ toastEl.textContent=t; toastEl.classList.add('on'); clearTimeout(toastEl._t); toastEl._t=setTimeout(()=>toastEl.classList.remove('on'),1800); };
let shareData=null;
function stopShare(id){
  const m=/^d(\d+)s(\d+)$/.exec(id||''); if(!m) return null;
  const d=DAYS[+m[1]], o=d&&d.stops[+m[2]]; if(!o) return null;
  const el=document.querySelector(`[data-tm="${id}"]`), t=el?(el.firstChild&&el.firstChild.nodeType===3?el.firstChild.textContent:o.t):o.t;
  const url=APPURL+'#'+id;
  const lines=[`[${d.tab} ${t}] ${plain(o.h)}`, plain(o.p)];
  if(o.map) lines.push('지도: '+M(o.map));
  lines.push('일정 보기: '+url);
  return {title:plain(o.h), text:lines.filter(Boolean).join('\n'), url, head:`${d.tab} · ${t}`};
}
function openSheet(id){
  shareData=stopShare(id); if(!shareData) return;
  sheet.querySelector('h4').textContent=shareData.title;
  sheet.querySelector('.sub').textContent=shareData.head;
  sheet.classList.add('on');
}
sheet.addEventListener('click',async e=>{
  const act=e.target.closest('button')?.dataset.act;
  if(!act){ if(e.target===sheet) sheet.classList.remove('on'); return; }
  if(act==='close'){ sheet.classList.remove('on'); return; }
  const {title,text}=shareData;
  if(act==='share'&&navigator.share){
    try{ await navigator.share({title,text}); sheet.classList.remove('on'); }catch(err){ if(err.name!=='AbortError') toast('공유를 열지 못했어요'); }
    return;
  }
  try{ await navigator.clipboard.writeText(text); toast('복사했어요. 카톡에 붙여 넣으면 돼요'); sheet.classList.remove('on'); }
  catch(err){ toast('복사하지 못했어요'); }
});
/* 길게 누르기 — 0.5초 동안 손가락이 거의 움직이지 않으면 메뉴를 띄운다. 링크 · 버튼 · 지도 위에서는 하지 않는다 */
let hold=null;
const holdCancel=()=>{ if(hold){ clearTimeout(hold.t); hold.el.classList.remove('hold'); hold=null; } };
panes.addEventListener('pointerdown',e=>{
  const st=e.target.closest('.stop'); if(!st||e.target.closest('a,button,input,textarea,summary,.lmap,[data-tm],.menu')) return;
  holdCancel();
  hold={el:st,x:e.clientX,y:e.clientY,fired:false};
  hold.t=setTimeout(()=>{ if(!hold) return; hold.fired=true; st.classList.add('hold'); navigator.vibrate&&navigator.vibrate(12);
    openSheet(st.dataset.id); setTimeout(()=>st.classList.remove('hold'),400); },500);
});
panes.addEventListener('pointermove',e=>{ if(hold&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>10) holdCancel(); });
['pointerup','pointercancel'].forEach(ev=>panes.addEventListener(ev,()=>{ if(hold&&!hold.fired) holdCancel(); else hold=null; }));
window.addEventListener('scroll',()=>{ if(hold&&!hold.fired) holdCancel(); },{passive:true});
/* 길게 눌렀을 때 뜨는 브라우저 기본 메뉴(복사 · 선택)는 일정 카드에서만 막는다 */
panes.addEventListener('contextmenu',e=>{ if(e.target.closest('.stop')&&!e.target.closest('a,.menu')) e.preventDefault(); });

/* ───────── 운전 탭 (막내 사위 전용) ─────────
   토요일 차 이동 구간을 한 화면에 모았다. 누르면 구글 지도가 지금 위치에서 그 목적지까지 바로 내비를 시작한다.
   목적지는 일정 카드의 길찾기와 같다(주차장이 있으면 주차장) */
const DRIVER='';
const SAT={stops:[],route:[]};
const drivePane=document.createElement('section'); drivePane.className='pane';
function driveLegs(){
  const out=[]; const st=SAT.stops;
  st.forEach((o,j)=>{
    if(o.m&&o.h.startsWith('⛴')) return;
    if(!o.h.startsWith('⛴')&&!o.m&&o.h.includes('페리')) return;
    if(o.m&&o.h.startsWith('🚗')){
      const [name,dur]=plain(o.h).replace(/^🚗\S*\s*/,'').split(' · ');
      /* 목적지는 제목의 「→ 이름」을 그날 동선에서 찾는다. 바로 다음 카드가 그곳이면 카드의 주차장 · 출입구를 쓴다 */
      const toName=(name.split('→').pop()||'').trim(), r=SAT.route.find(x=>x.n===toName);
      const card=st.slice(j+1).find(x=>!x.m&&x.map);
      const dest=card&&(!r||card.map===r.p)?(card.dir||card.park||card.map):(r&&r.p); if(!dest) return;
      out.push({t:o.t,name,dur,km:plain(o.p).split(' · ')[0],url:DIR(dest,'driving')+'&dir_action=navigate'});
    } else if(o.h.startsWith('⛴')) out.push({ferry:`${o.t} ${plain(o.h)}`});
  });
  return out;
}
function renderDrive(){
  const legs=driveLegs();
  /* 토요일 당일이면 일본 시각으로 다음 구간을 굵게 표시한다 */
  const jp=new Date(Date.now()+9*3600e3), today=jp.toISOString().slice(5,10)==='10-17', now=jp.toISOString().slice(11,16);
  const nextI=today?legs.findIndex(l=>l.t&&l.t>=now):-1;
  drivePane.innerHTML=`<div class="dvhead"><h2>🚗 토요일 운전</h2><em>누르면 지금 위치에서 바로 안내</em></div>
  <div class="dvlist">${legs.map((l,i)=>l.ferry?`<div class="ferry">${esc(l.ferry)}</div>`
    :`<a href="${l.url}" target="_blank" rel="noopener"${i===nextI?' class="next"':''}><b>${l.t}</b><span>${esc(l.name)}<i>${esc(l.dur||'')} · ${esc(l.km||'')}</i></span><em>안내</em></a>`).join('')}</div>
  <p class="dvfoot">구글 지도 앱이 열리고 바로 내비가 시작돼요. 경로 옵션에서 '유료도로 피하기'를 켜 두면 좋아요. 이 탭은 막내 사위에게만 보여요.</p>`;
}
renderDrive();
panes.appendChild(drivePane);
extra.drive=drivePane;
/* 막내 사위로 들어오면 운전 탭을 맨 앞에 붙이고 첫 화면으로 연다. 다른 이름이면 숨긴다 */
function applyDriver(open){
  let b=nav.querySelector('button[data-i="drive"]');
  if(ME===DRIVER){
    if(!b){ b=document.createElement('button'); b.dataset.i='drive'; b.className='drv'; b.textContent='🚗 운전'; nav.prepend(b); }
    if(open){ curTab='drive'; history.replaceState({t:'drive',s:0},'',location.pathname); renderDrive(); showTab('drive'); }
  } else if(b){
    b.remove();
    if(curTab==='drive'){ curTab='0'; history.replaceState({t:'0',s:0},'',location.pathname); showTab('0'); }
  }
}
applyDriver(!/^#d\d+s\d+$/.test(location.hash));
const _lo=document.getElementById('me'); _lo&&_lo.addEventListener('click',e=>{ if(e.target.id==='lo') setTimeout(()=>applyDriver(false),0); });

/* 공유 링크(#d0s12)로 들어오면 그 날 탭을 열고 그 일정으로 내려간다 */
(()=>{ const m=/^#d(\d+)s(\d+)$/.exec(location.hash); if(!m) return;

  const key=d.alt?String(SATMAIN):m[1];

    document.body.classList.remove('solo'); el.classList.remove('solo-on'); bar.remove();

    lockUntil=Date.now()+1000; window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-navBar.offsetHeight-12,behavior:'instant'});
    el.classList.add('hold'); setTimeout(()=>el.classList.remove('hold'),1500);

  nav.addEventListener('click',()=>{ if(document.body.classList.contains('solo')){ document.body.classList.remove('solo'); el.classList.remove('solo-on'); bar.remove(); } },{once:true});
  window.scrollTo({top:0,behavior:'instant'});
})();

/* ───────── 체크리스트 ───────── */
/* ───────── 실제 시각 조정 ───────── */
const toMin = t => { const [h,m]=String(t).split(':').map(Number); return h*60+m; };
const toHM  = m => { m=((m%1440)+1440)%1440; return `${String(m/60|0).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; };
/* 자기까지의 누적 지연(분). 앞 스톱을 밀면 뒤가 따라 밀리는 근거가 이 누적합이에요. */
const shiftAt = (i,j) => { let s=0; for(let x=0;x<=j;x++) s+=(local.times[`d${i}s${x}`]||{}).d||0; return s; };
const tmAt = el => { const m=/^d(\d+)s(\d+)$/.exec(el.dataset.tm||''); return m?[+m[1],+m[2]]:null; };

function renderTimes(){
  document.querySelectorAll('[data-tm]').forEach(el=>{
    if(el.querySelector('input')) return;
    const at=tmAt(el); if(!at) return;
    const o=DAYS[at[0]].stops[at[1]]; if(!o) return;
    const sh=shiftAt(at[0],at[1]);
    el.innerHTML = sh ? `${toHM(toMin(o.t)+sh)}<s>${o.t}</s>` : o.t;
    el.classList.toggle('adj', !!sh);
  });
}
listeners.times.push(renderTimes);

panes.addEventListener('click', e=>{
  const el=e.target.closest('[data-tm]');
  if(!el || el.querySelector('input')) return;
  const at=tmAt(el); if(!at) return;
  const [i,j]=at, id=`d${i}s${j}`, o=DAYS[i].stops[j];
  const cur=toMin(o.t)+shiftAt(i,j);
  const inp=document.createElement('input');
  inp.type='time'; inp.className='tedit'; inp.value=toHM(cur);
  el.innerHTML=''; el.appendChild(inp);
  inp.focus(); if(inp.showPicker) try{ inp.showPicker(); }catch(_){}
  let done=false;
  const close=commit=>{
    if(done) return; done=true;
    const v=inp.value;
    el.innerHTML=''; renderTimes();          // notify 재렌더가 막히지 않도록 입력창부터 걷어내요
    if(!commit || !v) return;
    let diff=toMin(v)-cur;
    diff=((diff+720)%1440+1440)%1440-720;    // 자정 넘김 입력을 ±12시간 안으로 해석
    if(diff) setTime(id, ((local.times[id]||{}).d||0)+diff, ME||'');
  };
  inp.addEventListener('change',()=>close(true));
  inp.addEventListener('blur',()=>close(true));
  inp.addEventListener('keydown',ev=>{ if(ev.key==='Escape') close(false); if(ev.key==='Enter') close(true); });
});

function renderChecks(){
  const box=document.getElementById('chk'); if(!box)return;
  box.innerHTML=CHECK.map(([id,t,sub])=>{
    const c=local.checks[id];
    return `<label class="check"><input type="checkbox" data-c="${id}"${c?' checked':''}>
      <span><b>${t}</b><br><span style="color:var(--muted);font-size:12.5px">${sub}</span>
      ${c?`<div class="byline">✓ ${esc(c.by)} · ${fmt(c.at)}</div>`:''}</span></label>`;
  }).join('');
  box.querySelectorAll('input[data-c]').forEach(el=>{
    el.onchange=()=>{ if(!ME){gate.classList.remove('hide');el.checked=!el.checked;return;}
      setCheck(el.dataset.c, el.checked, ME); };
  });
}
listeners.checks.push(renderChecks);

/* ───────── 댓글 · 반응 ───────── */
function renderSocial(){
  document.querySelectorAll('[data-bar]').forEach(bar=>{
    const id=bar.dataset.bar;
    const cs=local.comments.filter(c=>c.stop===id);
    const rs=Object.values(local.reactions).filter(r=>r.stop===id);
    const mine=rs.some(r=>r.by===ME);
    bar.innerHTML=`<button data-r="${id}" class="${mine?'act':''}">👍 ${rs.length||''}</button>
      <button data-t="${id}">💬 의견 ${cs.length||''}</button>
      ${rs.length?`<span class="cnt">${rs.map(r=>esc(r.by)).join(', ')}</span>`:''}`;
    bar.querySelector('[data-r]').onclick=()=>{ if(!ME){gate.classList.remove('hide');return;} toggleReact(id,ME); };
    bar.querySelector('[data-t]').onclick=()=>{
      document.querySelector(`[data-th="${id}"]`).classList.toggle('on'); };
  });
  document.querySelectorAll('[data-th]').forEach(th=>{
    const id=th.dataset.th;
    const cs=local.comments.filter(c=>c.stop===id);
    th.innerHTML=(cs.length?cs.map(c=>`<div class="cmt">
        <span class="who2">${esc(c.by)}<span class="when">${fmt(c.at)}</span></span>
        ${c.by===ME?`<button class="del" data-d="${c.id}">삭제</button>`:''}
        <div>${esc(c.text)}</div></div>`).join('')
      :`<div class="empty">${id==='board'?'아직 올라온 요청이 없습니다.':'아직 의견이 없습니다.'}</div>`)
     +`<div class="wr"><input placeholder="${id==='board'?'요청이나 의견을 남겨주세요':'이 일정에 대한 의견'}" data-i="${id}">
       <button data-s="${id}">남기기</button></div>`;
    const inp=th.querySelector(`[data-i]`), btn=th.querySelector(`[data-s]`);
    const send=()=>{ const v=inp.value.trim(); if(!v)return;
      if(!ME){gate.classList.remove('hide');return;} addComment(id,v,ME); inp.value=''; };
    btn.onclick=send; inp.onkeydown=e=>{if(e.key==='Enter')send()};
    th.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>delComment(b.dataset.d));
  });
  const all=document.getElementById('allc');
  if(all){
    const cs=local.comments.filter(c=>c.stop!=='board').slice().reverse();
    all.innerHTML=cs.length?cs.map(c=>{
      const [di,si]=c.stop.replace('d','').split('s').map(Number);
      const d=DAYS[di], s=d&&d.stops[si];
      return `<div class="cmt"><span class="who2">${esc(c.by)}<span class="when">${fmt(c.at)}</span></span>
        <div style="font-size:12px;color:var(--muted)">${s?`${d.tab} · ${s.t} ${esc(s.h)}`:''}</div>
        <div>${esc(c.text)}</div></div>`;
    }).join(''):`<div class="empty">일정에 달린 의견이 아직 없습니다.</div>`;
  }
}
listeners.comments.push(renderSocial);
listeners.reactions.push(renderSocial);

/* ───────── 시작 ───────── */
(async()=>{
  online = await initDB();
  const st=document.getElementById('status');
  const mode=document.getElementById('mode');
  if(online){ st.textContent=''; if(mode){mode.textContent='함께 보기 모드 — 연결됨';mode.style.color='var(--seto)';} }
  else{ st.textContent='혼자 보기 모드 — 체크와 댓글이 이 기기에만 남습니다';
        if(mode) mode.textContent='혼자 보기 모드 (아직 연결 전)'; }
  renderChecks(); renderSocial(); renderTimes();
  document.querySelectorAll('details[data-map]').forEach(el=>{
    el.addEventListener('toggle',()=>{ if(el.open) drawMaps(+el.dataset.map); });
  });
})();
</script>
